# nginx site config for the static copy of victory.org.il
# The site files go in /var/www/victory (the contents of site/).
server {
    listen 80;
    listen [::]:80;
    server_name victory.org.il www.victory.org.il;
    root /var/www/victory;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # long cache for images, fonts, styles and scripts
    location ~* \.(?:css|js|png|jpe?g|webp|gif|svg|ico|woff2?|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # old WordPress addresses that no longer exist
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json) { return 404; }
    location = /feed/ { return 404; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
