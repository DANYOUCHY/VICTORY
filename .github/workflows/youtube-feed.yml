name: Update YouTube videos

# Puts the channel's 5 latest videos into the sidebar of every page.
# Runs every 6 hours, so new videos show up without anyone touching the site.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - tools/youtube_feed.py
      - .github/workflows/youtube-feed.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the channel feed
        run: curl -sSfL "https://www.youtube.com/feeds/videos.xml?channel_id=UCcszsZ1SGDe5uRXQoooU8vQ" -o feed.xml
      - name: Update pages
        run: python3 tools/youtube_feed.py site feed.xml && rm feed.xml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          git commit -m "Update sidebar YouTube videos" || echo "No new videos"
          git push
