name: Update the live site right away

# Every update of main tells the server to take it now. Updates pushed by another
# workflow do not fire "push", so the sidebar videos workflow is listed separately.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update YouTube videos"]
    types: [completed]
  workflow_dispatch:

jobs:
  tell-server:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tell the server to pull now
        # The key is the repository secret VICTORY_SYNC_KEY (Settings -> Secrets and variables -> Actions).
        # The server compares it with the key file next to victory-static-sync.sh (see site/deploy-api/sync.php).
        env:
          SYNC_KEY: ${{ secrets.VICTORY_SYNC_KEY }}
        run: |
          if [ -z "$SYNC_KEY" ]; then
            echo "The repository secret VICTORY_SYNC_KEY is not set." >&2
            exit 1
          fi
          curl -fsS --retry 4 --retry-delay 5 -X POST -H "X-Sync-Key: $SYNC_KEY" -A "Mozilla/5.0 (compatible; VictorySiteUpdate)" https://www.victory.org.il/static-repo/site/deploy-api/sync.php
