name: Mirror victory.org.il

# Copies the live WordPress site into static files under site/.
# Runs on GitHub's servers, which can reach the site directly.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mirror.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Collect URLs from sitemaps
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          : > urls.txt
          for idx in sitemaps.xml sitemap_index.xml wp-sitemap.xml sitemap.xml; do
            curl -sL -A "$UA" "https://www.victory.org.il/$idx" -o idx.xml || true
            if grep -q "<loc>" idx.xml 2>/dev/null; then
              echo "Using sitemap index: $idx"
              for sm in $(grep -o "<loc>[^<]*</loc>" idx.xml | sed 's/<\/\?loc>//g'); do
                curl -sL -A "$UA" "$sm" | grep -o "<loc>[^<]*</loc>" | sed 's/<\/\?loc>//g' >> urls.txt || true
              done
              break
            fi
          done
          echo "https://www.victory.org.il/" >> urls.txt
          grep -v -E '\.xml$' urls.txt | sort -u > urls2.txt && mv urls2.txt urls.txt
          echo "URL count: $(wc -l < urls.txt)"
          head -20 urls.txt

      - name: Download site
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          rm -rf site && mkdir -p mirror
          cd mirror
          wget --recursive --level=inf --page-requisites --adjust-extension \
               --convert-links --no-parent -e robots=off \
               --user-agent="$UA" --wait=0.3 --random-wait --tries=3 --timeout=30 \
               --domains=victory.org.il,www.victory.org.il \
               --reject-regex '(wp-admin|wp-login|xmlrpc|wp-json|/feed/?$|/feed/|\?replytocom|\?s=|/embed/?$|oembed)' \
               --no-host-directories \
               -i ../urls.txt || true
          cd ..
          mv mirror site
          echo "Files: $(find site -type f | wc -l)"
          du -sh site

      - name: Write report
        run: |
          {
            echo "# Mirror report"
            echo
            echo "Run: $(date -u)"
            echo
            echo "URLs from sitemap: $(wc -l < urls.txt)"
            echo "Files downloaded: $(find site -type f | wc -l)"
            echo "Size: $(du -sh site | cut -f1)"
            echo
            echo "## HTML pages"
            find site -name '*.html' | sort | head -500
          } > MIRROR_REPORT.md
          mv urls.txt site-urls.txt
          rm -f idx.xml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site MIRROR_REPORT.md site-urls.txt
          git commit -m "Mirror victory.org.il as static files" || echo "Nothing to commit"
          git push
